<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evolv28 | Resource Hub</title>
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div class="brand-bg"></div>

    <header class="top-nav">
      <div class="nav-container">
        <div class="nav-left">
          <!-- <div class="logo">Evolv28</div> -->
          <img
            src="evolve-logo.png"
            alt="Evolv28"
            style="height: 40px; width: auto; display: block"
          />
          <div class="nav-divider"></div>
          <span class="nav-subtitle">Resource Hub</span>
        </div>

        <a style="text-decoration: none" href="/contact.html">
          <button class="support-btn">
            <i data-lucide="phone" class="icon-sm"></i>
            <span>Contact Us</span>
          </button>
        </a>
      </div>
    </header>

    <main class="main-content">
      <div class="header-titles">
        <div class="badge-pill">Directory</div>
        <h1>Clinical & Technical Documentation</h1>
        <p>
          Select a category to access detailed guides, research, and technical
          specifications.
        </p>
      </div>

      <div class="grid-container" id="tileGrid"></div>
    </main>

    <div class="modal-backdrop" id="modalBackdrop"></div>

    <div class="modal" id="documentModal">
      <div class="modal-header">
        <div class="modal-title-group">
          <div class="icon-container-large" id="modalIconContainer">
            <i id="modalIcon" data-lucide="file-text"></i>
          </div>
          <div>
            <h2 id="modalTitle">Document Title</h2>
            <p id="modalDesc">Document description goes here.</p>
          </div>
        </div>
        <button class="close-btn" id="closeBtn" aria-label="Close modal">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="documents-container" id="documentsContainer"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
